<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>BhishiBook is offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f7f2;
        color: #1f2933;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        max-width: 26rem;
        text-align: center;
        background: #fff;
        border: 1px solid #d8ddd2;
        border-radius: 12px;
        padding: 32px 24px;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 10px;
        background: #166534;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.6;
        color: #667085;
        font-size: 0.95rem;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #166534;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .note {
        margin: 20px 0 0;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"></div>
      <h1>You are offline</h1>
      <p>
        BhishiBook needs a connection to show your hafta, loans, and balances. Figures are
        never served from an old copy, so that nobody acts on a stale number.
      </p>
      <button onclick="location.reload()" type="button">Try again</button>
      <p class="note">Powered by BhishiBook</p>
    </div>
  </body>
</html>
